name: 지원사업 이메일
on:
  push:
    branches: [main]
    paths: ['.github/workflows/digest.yml']
  schedule:
    - cron: '17 23 * * *' # 08:17 KST; GitHub may delay scheduled runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: '발송 없이 점검'
        type: boolean
        default: true
      test_email:
        description: '연결 테스트 메일 (실제 발송하려면 발송 없이 점검을 해제)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: email-digest
  cancel-in-progress: false
jobs:
  digest:
    if: vars.EMAIL_DIGEST_ENABLED == 'true' || inputs.test_email == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @muse/collectors exec tsx test/digest.test.ts
      - run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              pnpm --filter @muse/collectors exec tsx src/send-digest.ts --test --dry
            else
              pnpm --filter @muse/collectors exec tsx src/send-digest.ts --test
            fi
          elif [ "$DRY_RUN" = "true" ]; then
            pnpm --filter @muse/collectors exec tsx src/send-digest.ts --dry
          else
            pnpm --filter @muse/collectors exec tsx src/send-digest.ts
          fi
        env:
          TEST_EMAIL: ${{ inputs.test_email }}
          DRY_RUN: ${{ inputs.dry_run }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_USER_ID: ${{ secrets.DIGEST_USER_ID }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_SITE_URL: ${{ vars.DIGEST_SITE_URL }}
      - name: Verify stored profile and digest selection without sending
        if: inputs.test_email != true && inputs.dry_run != true
        run: pnpm --filter @muse/collectors exec tsx src/send-digest.ts --dry
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_USER_ID: ${{ secrets.DIGEST_USER_ID }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_SITE_URL: ${{ vars.DIGEST_SITE_URL }}
